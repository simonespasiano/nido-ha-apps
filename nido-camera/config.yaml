name: NIDO Camera
version: "0.1.0"
slug: nido_camera
description: Camera HomeKit (Aqara G3) in Home Assistant con go2rtc - diretta, foto, registrazione al movimento, notifiche con foto e regole di privacy
url: https://github.com/simonespasiano/nido-ha-apps
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cctv
panel_title: NIDO Camera
homeassistant_api: true
host_network: false
services:
  - mqtt:want
map:
  - homeassistant_config:ro
  - media:rw
ports:
  8554/tcp: 8554
ports_description:
  8554/tcp: Flusso RTSP della camera, per Generic Camera o altri programmi
options:
  camera: ""
  sensori_movimento: []
  notifiche: []
  persone: []
  clip_dopo_movimento_secondi: 20
  clip_massima_secondi: 180
  conserva_giorni: 14
  spazio_massimo_gb: 20
  pubblica_in_home_assistant: true
  debug: false
schema:
  camera: str?
  sensori_movimento:
    - str
  notifiche:
    - str
  persone:
    - str
  clip_dopo_movimento_secondi: int(5,300)
  clip_massima_secondi: int(15,1800)
  conserva_giorni: int(1,365)
  spazio_massimo_gb: int(1,2000)
  pubblica_in_home_assistant: bool
  debug: bool
