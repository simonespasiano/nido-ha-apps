name: NIDO Clima
version: "0.5.2"
slug: nido_clima
description: Stanze, valvole e sensori in chiaro, rilevamento del calorifero acceso e diario di ciò che accade
url: https://github.com/simonespasiano/nido-ha-apps
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radiator
panel_title: NIDO Clima
homeassistant_api: true
options:
  stanze: []
  soglia_accensione: 2.5
  soglia_spegnimento: 1.2
  intervallo_secondi: 60
  conserva_giorni: 120
  pubblica_sensori: true
  fonte_termosifone: auto
schema:
  stanze:
    - nome: str
      valvola: str
      sensore_temperatura: str
      sensore_umidita: str?
      termostato: str?
      sensore_termosifone: str?
  soglia_accensione: float(0.5,15)
  soglia_spegnimento: float(0.1,10)
  intervallo_secondi: int(15,600)
  conserva_giorni: int(7,730)
  pubblica_sensori: bool
  fonte_termosifone: list(auto|valvola|interna)
