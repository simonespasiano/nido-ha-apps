name: NIDO Sistema
version: "0.2.0"
slug: nido_sistema
description: Raspberry Pi in chiaro - temperature di CPU, RP1 e SSD, ventola con curve e modalità, alimentazione, storico e avvisi
url: https://github.com/simonespasiano/nido-ha-apps
arch:
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:raspberry-pi
panel_title: NIDO Sistema
homeassistant_api: true
hassio_api: true
# Home Assistant monta /sys in sola lettura in tutte le app; con SYS_ADMIN l'app monta un secondo
# sysfs in scrittura solo per la ventola. Il profilo AppArmor predefinito vieterebbe il montaggio.
privileged:
  - SYS_ADMIN
apparmor: false
services:
  - mqtt:want
options:
  notifiche: []
  avviso_temperatura: 75
  conserva_giorni: 30
  pubblica_in_home_assistant: true
  debug: false
schema:
  notifiche:
    - str
  avviso_temperatura: int(50,85)
  conserva_giorni: int(1,365)
  pubblica_in_home_assistant: bool
  debug: bool
